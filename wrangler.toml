name = "monfily-new-version"
main = "worker/index.ts"
compatibility_date = "2026-05-22"
workers_dev = true
preview_urls = true

[dev]
port = 3001

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* sempre passa pelo Worker; o resto é servido como asset estático (SPA fallback).
run_worker_first = ["/api/*"]
