name = "monfily-new-version"
main = "worker/index.ts"
compatibility_date = "2026-05-22"
workers_dev = true
preview_urls = true

[dev]
port = 3001

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* sempre passa pelo Worker; o resto é servido como asset estático (SPA fallback).
run_worker_first = ["/api/*"]

# Durable Object que agenda (via alarm) o envio do WhatsApp ao cliente 5 minutos
# após o preenchimento do formulário. Criado sob demanda no deploy.
[[durable_objects.bindings]]
name = "WHATSAPP_SCHEDULER"
class_name = "WhatsappScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WhatsappScheduler"]
